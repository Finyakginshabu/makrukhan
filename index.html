<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Makrukhan</title>
    <meta name="color-scheme" content="dark light">
    <script>
        // Apply the player's saved language and theme before first paint, so
        // the page doesn't flash. Defaults: English, dark.
        (function () {
            var root = document.documentElement, theme = null, lang = null;
            try { theme = localStorage.getItem("theme"); lang = localStorage.getItem("lang"); } catch (e) {}
            root.dataset.theme = theme === "light" ? "light" : "dark";
            root.lang = lang === "th" ? "th" : "en";
        })();
    </script>
    <link rel="icon" href="assets/pieces/knight.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
    <!-- Icons: Material Symbols, only the ones used (names must stay in alphabetical order). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check,chevron_left,chevron_right,close,content_copy,dark_mode,light_mode,menu,pause,play_arrow,restart_alt,send,skip_next,skip_previous,undo&display=block">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="brand-bar">
            <img class="brand-icon" src="assets/pieces/knight.svg" alt="">
            <div class="brand-text">
                <h1 data-i18n="title">Makrukhan</h1>
                <p class="tagline" data-i18n="tagline"></p>
            </div>
        </header>

        <!-- When the toolbar is narrow, language and theme fold into a menu
             behind the ☰ button (see "Toolbar" in css/style.css). -->
        <div class="toolbar">
            <div class="prefs">
                <button type="button" id="prefs-btn" class="icon-btn prefs-btn" aria-expanded="false"
                    aria-controls="prefs-menu" data-i18n-aria-label="prefs.label">
                    <span class="icon" aria-hidden="true">menu</span>
                </button>
                <div id="prefs-menu" class="prefs-menu">
                    <div class="segmented" role="group" data-i18n-aria-label="lang.label">
                        <button type="button" data-lang="th">ไทย</button>
                        <button type="button" data-lang="en">EN</button>
                    </div>
                    <button type="button" id="theme-toggle" class="icon-btn">
                        <span class="icon icon-moon" aria-hidden="true">dark_mode</span>
                        <span class="icon icon-sun" aria-hidden="true">light_mode</span>
                    </button>
                </div>
            </div>
            <input type="text" id="nameInput" class="name-input" maxlength="50" autocomplete="nickname"
                data-i18n-placeholder="name.label" data-i18n-aria-label="name.label">
            <button type="button" id="help-btn" class="btn fixed-label" data-i18n-fixed="help.open">How to play?</button>
        </div>

        <div class="board-wrap">
            <canvas id="chessboard" role="img" data-i18n-aria-label="board.label"></canvas>
        </div>

        <aside class="panel">
            <section class="panel-section">
                <div class="score-row">
                    <div>
                        <div class="label" data-i18n="score.label"></div>
                        <div class="score">
                            <span id="score-number">0</span>
                            <span id="score-delta" class="delta" hidden></span>
                        </div>
                    </div>
                    <div class="piece">
                        <img id="piece-icon" src="assets/pieces/knight.svg" alt="">
                        <div>
                            <div class="label" data-i18n="piece.label"></div>
                            <div id="piece-name" class="piece-name"></div>
                        </div>
                    </div>
                </div>
                <div class="chips">
                    <span id="shield-chip" class="chip chip-shield" hidden></span>
                    <span id="mult-chip" class="chip chip-mult" hidden></span>
                    <span id="end-chip" class="chip chip-end" hidden></span>
                </div>
            </section>

            <section class="panel-section history-section">
                <div class="section-head">
                    <h2 class="section-title" data-i18n="history.title"></h2>
                    <!-- Label and tooltip are set by js/game.js. -->
                    <button type="button" id="copy-btn" class="icon-btn icon-btn-sm">
                        <span id="copy-icon" class="icon" aria-hidden="true">content_copy</span>
                    </button>
                </div>
                <ol id="move-history" class="history"></ol>
            </section>

            <section class="panel-section">
                <h2 class="section-title" data-i18n="replay.title"></h2>
                <input type="text" id="replay-input" class="replay-input" spellcheck="false" autocomplete="off"
                    data-i18n-placeholder="replay.placeholder" data-i18n-aria-label="replay.title">
                <!-- Labels and tooltips are set by js/game.js. -->
                <div class="replay-controls">
                    <button type="button" id="replay-start" class="icon-btn" disabled>
                        <span class="icon" aria-hidden="true">skip_previous</span>
                    </button>
                    <button type="button" id="replay-back" class="icon-btn" disabled>
                        <span class="icon" aria-hidden="true">chevron_left</span>
                    </button>
                    <button type="button" id="replay-play" class="icon-btn replay-play">
                        <span id="replay-play-icon" class="icon" aria-hidden="true">play_arrow</span>
                    </button>
                    <button type="button" id="replay-forward" class="icon-btn" disabled>
                        <span class="icon" aria-hidden="true">chevron_right</span>
                    </button>
                    <button type="button" id="replay-end" class="icon-btn" disabled>
                        <span class="icon" aria-hidden="true">skip_next</span>
                    </button>
                    <button type="button" id="replay-speed" class="icon-btn replay-speed">1×</button>
                </div>
                <p id="replay-status" class="replay-status"></p>
            </section>

            <footer class="panel-footer">
                <!-- In the panel on desktop; a bar fixed to the bottom of the screen on phones and tablets. -->
                <div class="action-bar">
                    <button type="button" id="undo-btn" class="btn">
                        <span class="icon" aria-hidden="true">undo</span>
                        <span data-i18n="undo"></span>
                    </button>
                    <button type="button" id="reset-btn" class="btn">
                        <span class="icon" aria-hidden="true">restart_alt</span>
                        <span data-i18n="reset"></span>
                    </button>
                    <button type="button" id="send-btn" class="btn btn-primary" disabled>
                        <span class="icon" aria-hidden="true">send</span>
                        <span data-i18n="send"></span>
                    </button>
                </div>
                <p id="send-status" class="send-status" aria-live="polite"></p>
            </footer>
        </aside>
    </div>

    <dialog id="help" class="help" aria-labelledby="help-title">
        <div class="help-inner">
            <header class="help-head">
                <h2 id="help-title" data-i18n="title"></h2>
                <button type="button" id="help-close" class="icon-btn" data-i18n-aria-label="help.close">
                    <span class="icon" aria-hidden="true">close</span>
                </button>
            </header>

            <div class="help-body">
                <p data-i18n="help.intro1"></p>
                <p data-i18n="help.intro2"></p>

                <details class="pieces">
                    <summary data-i18n="help.pieces"></summary>
                    <div class="piece-grid">
                        <figure>
                            <img src="assets/help/knight-move.svg" alt="">
                            <figcaption>
                                <strong data-i18n="piece.knight"></strong>
                                <span data-i18n="help.knight"></span>
                            </figcaption>
                        </figure>
                        <figure>
                            <img src="assets/help/rook-move.svg" alt="">
                            <figcaption>
                                <strong data-i18n="piece.rook"></strong>
                                <span data-i18n="help.rook"></span>
                            </figcaption>
                        </figure>
                        <figure>
                            <img src="assets/help/bishop-move.svg" alt="">
                            <figcaption>
                                <strong data-i18n="piece.bishop"></strong>
                                <span data-i18n="help.bishop"></span>
                            </figcaption>
                        </figure>
                    </div>
                </details>

                <h3 data-i18n="help.howTitle"></h3>
                <p data-i18n="help.howBody"></p>

                <h3 data-i18n="help.squaresTitle"></h3>
                <ul class="square-grid">
                    <li><img src="assets/squares/treasure.svg" alt=""><div><strong data-i18n="sq.treasure"></strong><span data-i18n="sq.treasure.desc"></span></div></li>
                    <li><img src="assets/squares/blessing.svg" alt=""><div><strong data-i18n="sq.blessing"></strong><span data-i18n="sq.blessing.desc"></span></div></li>
                    <li><img src="assets/squares/safe.svg" alt=""><div><strong data-i18n="sq.safe"></strong><span data-i18n="sq.safe.desc"></span></div></li>
                    <li><img src="assets/squares/armour.svg" alt=""><div><strong data-i18n="sq.armour"></strong><span data-i18n="sq.armour.desc"></span></div></li>
                    <li><img src="assets/squares/multiplier.svg" alt=""><div><strong data-i18n="sq.multiplier"></strong><span data-i18n="sq.multiplier.desc"></span></div></li>
                    <li><img src="assets/squares/spirit.svg" alt=""><div><strong data-i18n="sq.spirit"></strong><span data-i18n="sq.spirit.desc"></span></div></li>
                    <li><img src="assets/squares/pond.svg" alt=""><div><strong data-i18n="sq.pond"></strong><span data-i18n="sq.pond.desc"></span></div></li>
                </ul>

                <p class="caution" data-i18n="help.caution"></p>
                <p data-i18n="help.controls"></p>
            </div>
        </div>
    </dialog>

    <script src="js/rules.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
